<div class="min-h-screen bg-[#FAF8F2]">

    <!-- Cabeçalho -->
    <header class="border-b border-[#E8E0D0] bg-white">
        <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-5">

            <a routerLink="/home"
                class="flex h-11 w-11 items-center justify-center rounded-xl bg-[#172554] text-white transition hover:bg-[#243968]"
                aria-label="Voltar para a página inicial">

                <svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

                    <rect x="3" y="4" width="18" height="16" rx="2" />
                    <path d="M7 8h10M7 12h10M7 16h6" />
                </svg>
            </a>

            <div>
                <h1 class="text-lg font-bold tracking-tight text-[#172554]">
                    Gerador de Certificados
                </h1>

                <p class="text-sm text-slate-500">
                    Gestão de certificados por curso
                </p>
            </div>

        </div>
    </header>

    <!-- Conteúdo principal -->
    <div class="mx-auto grid max-w-7xl gap-8 px-6 py-8 lg:grid-cols-[250px_minmax(0,1fr)]">

        <!-- Menu lateral -->
        <aside>
            <div class="rounded-2xl border border-[#E8E0D0] bg-white p-4">

                <p class="mb-4 px-3 text-xs font-semibold uppercase tracking-[0.16em] text-[#B89A5A]">
                    Certificados
                </p>

                <nav class="space-y-1">

                    <!-- Solicitação -->
                    <a routerLink="/certificado/solicitacao" routerLinkActive="bg-[#172554] !text-white"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-[#F4F1E8] hover:text-[#172554]">

                        <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

                            <path d="M12 5v14M5 12h14" />
                        </svg>

                        <span>Solicitar certificados</span>
                    </a>

                    <!-- Listagem -->
                    <a routerLink="/certificado/listagem" routerLinkActive="bg-[#172554] !text-white"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-[#F4F1E8] hover:text-[#172554]">

                        <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

                            <path d="M8 6h13M8 12h13M8 18h13" />
                            <path d="M3 6h.01M3 12h.01M3 18h.01" />
                        </svg>

                        <span>Certificados gerados</span>
                    </a>

                </nav>

                <!-- Separador -->
                <div class="my-5 border-t border-[#E8E0D0]"></div>

                <!-- Retorno aos cursos -->
                <a routerLink="/home"
                    class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-600 transition hover:bg-[#F4F1E8] hover:text-[#172554]">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"
                        aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                    </svg>

                    <span>Voltar ao inicio</span>
                </a>

            </div>

            <!-- Cartão informativo -->
            <div class="mt-5 rounded-2xl border border-[#E8E0D0] bg-[#F4F1E8] p-5">
                <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-xl bg-white text-[#B89A5A]">

                    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

                        <path d="M8 21h8" />
                        <path d="M12 17v4" />
                        <rect x="4" y="3" width="16" height="14" rx="2" />
                        <path d="m9 10 2 2 4-4" />
                    </svg>

                </div>

                <h2 class="text-sm font-semibold text-[#172554]">
                    Emissão de certificados
                </h2>

                <p class="mt-2 text-xs leading-5 text-slate-600">
                    Gerencie as solicitações e acompanhe a geração dos certificados dos seus cursos.
                </p>
            </div>
        </aside>

        <!-- Área das rotas filhas -->
        <main class="min-w-0">
            <router-outlet />
        </main>

    </div>

</div>
