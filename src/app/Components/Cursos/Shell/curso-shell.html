<div class="min-h-screen bg-[#FAF8F2] text-[#334155]">

    <div class="flex min-h-screen">

        <!-- Menu lateral -->
        <aside class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-[#E8E0D0] bg-white">

            <!-- Marca -->
            <a routerLink="/curso/listagem"
                class="flex h-20 shrink-0 items-center gap-3 border-b border-[#E8E0D0] px-6 focus-visible:outline-2 focus-visible:outline-offset-[-4px] focus-visible:outline-[#B89A5A]">

                <span
                    class="grid h-11 w-11 shrink-0 place-items-center border border-[#B89A5A] bg-[#172554] text-[#D8C69E]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"
                        aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                        <path d="M14 2v6h6" />
                        <path d="M8 13h8M8 17h8M8 9h2" />
                    </svg>
                </span>

                <span>
                    <span class="block text-lg font-semibold tracking-tight text-[#172554]">
                        Certifica<span class="text-[#B89A5A]">+</span>
                    </span>
                    <span class="mt-0.5 block text-xs text-[#647084]">
                        Gestão de certificados
                    </span>
                </span>
            </a>

            <!-- Navegação -->
            <nav class="flex-1 space-y-2 px-4 py-7">

                <p class="mb-4 px-3 text-[10px] font-semibold uppercase tracking-[0.25em] text-[#8B7650]">
                    Menu principal
                </p>

                <!-- Início -->
                <a routerLink="/home" routerLinkActive="border-[#B89A5A] bg-[#172554] text-white"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="flex items-center gap-3 border-l-2 border-transparent px-4 py-3 text-sm font-medium text-[#647084] transition-colors hover:border-[#B89A5A]/60 hover:bg-[#FAF8F2] hover:text-[#172554]">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"
                        aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                    </svg>

                    Início
                </a>

                <!-- Listagem -->
                <a routerLink="/curso/listagem" routerLinkActive="border-[#B89A5A] bg-[#172554] text-white"
                    class="flex items-center gap-3 border-l-2 border-transparent px-4 py-3 text-sm font-medium text-[#647084] transition-colors hover:border-[#B89A5A]/60 hover:bg-[#FAF8F2] hover:text-[#172554]">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"
                        aria-hidden="true">
                        <path d="M4 4h16v16H4z" />
                        <path d="M8 8h8M8 12h8M8 16h5" />
                    </svg>

                    Cursos
                </a>

                <!-- Cadastro -->
                <a routerLink="/curso/cadastro" routerLinkActive="border-[#B89A5A] bg-[#172554] text-white"
                    class="flex items-center gap-3 border-l-2 border-transparent px-4 py-3 text-sm font-medium text-[#647084] transition-colors hover:border-[#B89A5A]/60 hover:bg-[#FAF8F2] hover:text-[#172554]">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0"
                        aria-hidden="true">
                        <path d="M12 5v14M5 12h14" />
                    </svg>

                    Cadastrar curso
                </a>
            </nav>

            <!-- Identificação do usuário -->
            <div class="shrink-0 border-t border-[#E8E0D0] p-4">
                <div class="flex items-center gap-3 border border-[#E8E0D0] bg-[#FAF8F2] p-3">

                    <span
                        class="grid h-10 w-10 shrink-0 place-items-center border border-[#B89A5A]/50 bg-[#172554] text-[#D8C69E]">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"
                            aria-hidden="true">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
                        </svg>
                    </span>

                    <span class="min-w-0 flex-1">
                        <span class="block truncate text-sm font-semibold text-[#172554]">
                            Minha conta
                        </span>
                        <span class="mt-0.5 block text-xs text-[#647084]">
                            Área do usuário
                        </span>
                    </span>

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        class="h-5 w-5 shrink-0 text-[#8B7650]" aria-hidden="true">
                        <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </div>
            </div>
        </aside>

        <!-- Área principal -->
        <div class="ml-64 flex min-h-screen min-w-0 flex-1 flex-col">

            <!-- Cabeçalho -->
            <header
                class="sticky top-0 z-30 flex h-20 shrink-0 items-center justify-between border-b border-[#E8E0D0] bg-[#FAF8F2]/95 px-8 backdrop-blur">

                <div>
                    <div class="flex items-center gap-2">
                        <span class="h-px w-6 bg-[#B89A5A]"></span>
                        <p class="text-[10px] font-semibold uppercase tracking-[0.25em] text-[#8B7650]">
                            Certifica+ · Gestão
                        </p>
                    </div>

                    <h2 class="mt-1.5 font-serif text-xl font-semibold tracking-tight text-[#172554]">
                        Gerenciamento de cursos
                    </h2>
                </div>

                <div class="hidden items-center gap-3 sm:flex">
                    <span class="text-xs text-[#647084]">
                        Educação · Reconhecimento · Gestão
                    </span>

                    <span class="grid h-10 w-10 place-items-center border border-[#E8E0D0] bg-white text-[#B89A5A]">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"
                            aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                            <path d="M14 2v6h6" />
                            <path d="M8 13h8M8 17h5" />
                        </svg>
                    </span>
                </div>
            </header>

            <!-- Conteúdo das rotas filhas -->
            <main class="flex-1 px-5 py-7 sm:px-8 sm:py-9">
                <div class="mx-auto w-full max-w-7xl">
                    <router-outlet></router-outlet>
                </div>
            </main>

            <!-- Rodapé -->
            <footer class="border-t border-[#E8E0D0] bg-white px-8 py-5">
                <p class="text-center text-xs leading-6 text-[#647084]">
                    © 2026 Certifica+. Gestão de certificados.
                </p>
            </footer>

        </div>
    </div>
</div>
