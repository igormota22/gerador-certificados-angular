<app-auth-shell>
    <div>
        <!-- Cabeçalho -->
        <div class="mb-8">
            <h2 class="font-serif text-3xl leading-tight tracking-tight text-[#172554] sm:text-4xl">
                Bem-vindo!
            </h2>

            <p class="mt-3 text-sm leading-6 text-[#647084]">
                Volte a organizar seus cursos e certificados em um só lugar.
            </p>
        </div>

        <!-- Formulário -->
        <form class="space-y-5" (ngSubmit)="enviarFormulario()">

            <!-- E-mail -->
            <div>
                <label for="email" class="mb-2 block text-sm font-medium text-[#172554]">
                    E-mail
                </label>

                <input id="email" name="email" type="email" autocomplete="email" placeholder="Informe seu e-mail"
                    required [(ngModel)]="form.email"
                    class="w-full border border-[#E8E0D0] bg-white px-4 py-3.5 text-sm text-[#334155] outline-none transition placeholder:text-slate-400 hover:border-[#B89A5A] focus:border-[#B89A5A] focus:ring-1 focus:ring-[#B89A5A]" />

                @if (erroEmail()) {
                <p class="mt-2 text-sm text-red-600">
                    {{ erroEmail() }}
                </p>
                }
            </div>

            <!-- Senha -->
            <div>
                <label for="senha" class="mb-2 block text-sm font-medium text-[#172554]">
                    Senha
                </label>

                <input id="senha" name="senha" type="password" autocomplete="current-password"
                    placeholder="Informe sua senha" required [(ngModel)]="form.senha"
                    class="w-full border border-[#E8E0D0] bg-white px-4 py-3.5 text-sm text-[#334155] outline-none transition placeholder:text-slate-400 hover:border-[#B89A5A] focus:border-[#B89A5A] focus:ring-1 focus:ring-[#B89A5A]" />

                @if (erroSenha()) {
                <p class="mt-2 text-sm text-red-600">
                    {{ erroSenha() }}
                </p>
                }
            </div>

            <!-- Botão -->
            <button type="submit"
                class="flex w-full items-center justify-center gap-3 bg-[#172554] px-6 py-4 text-sm font-semibold text-white transition hover:bg-[#263B70] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#B89A5A]">
                Entrar na minha conta

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-4" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m-6.75-6.75L19.5 12l-6.75 6.75" />
                </svg>
            </button>

        </form>

        <!-- Link para cadastro -->
        <div class="mt-8 border-t border-[#E8E0D0] pt-6 text-center">
            <p class="text-sm text-[#647084]">
                Não possui uma conta?

                <a routerLink="/cadastro"
                    class="ml-1 font-semibold text-[#172554] underline decoration-[#B89A5A] underline-offset-4 transition hover:text-[#8B7650]">
                    Cadastrar-se
                </a>
            </p>
        </div>
    </div>
</app-auth-shell>
